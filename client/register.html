<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration — GarageFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-garageflow">
        <div class="container-fluid px-lg-4">
            <a class="navbar-brand-logo" href="/admin/dashboard.html">
                <img src="/images/logo.png" alt="GarageFlow Logo" style="height: 52px; max-height: 60px; width: auto; object-fit: contain;">
            </a>
            <div id="navUserContainer" class="d-flex align-items-center ms-auto"></div>
        </div>
    </nav>

    <!-- Register Container -->
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="gf-card">
                    <div class="text-center mb-4">
                        <img src="/images/logo.png" alt="GarageFlow Logo" style="height: 52px; max-height: 60px; width: auto; object-fit: contain;">
                        <h4 class="fw-bold text-white mb-1">Create Customer Account</h4>
                        <p class="text-secondary small">Register to add vehicles and book workshop services</p>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" required placeholder="e.g. Alex Johnson">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-7">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="email" required placeholder="alex@example.com">
                            </div>
                            <div class="col-md-5">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" required placeholder="+1 555-0199">
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" required placeholder="Min 6 characters">
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                <input type="password" class="form-control" id="confirmPassword" required placeholder="Re-enter password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-gf-primary w-100 py-2.5 fw-semibold mt-2">
                            <i class="bi bi-check-circle me-2"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <span class="small text-secondary">Already have a GarageFlow account?</span>
                        <a href="/login.html" class="small fw-semibold text-info text-decoration-none ms-1">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-auto">
        <div class="container text-center py-3">
            <p class="small text-muted mb-0">GarageFlow — Smart Vehicle Service Management System</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please re-enter.');
                return;
            }

            const res = await apiFetch('/auth/register', {
                method: 'POST',
                body: JSON.stringify({ name, email, phone, password })
            });

            if (res && res.success) {
                setAuthSession(res.token, res.user);
                showAlert('Account registered successfully! Redirecting to Customer Dashboard...', 'success');
                setTimeout(() => {
                    window.location.href = '/customer/dashboard.html';
                }, 800);
            } else {
                showAlert(res ? res.message : 'Registration failed.');
            }
        });
    </script>
</body>
</html>
