<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers Directory — GarageFlow Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
</head>
<body>
    <div class="gf-app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="gf-sidebar">
            <a href="/admin/dashboard.html" class="gf-sidebar-brand">
                <img src="/images/logo.png" alt="GarageFlow Logo" style="height: 52px; max-height: 60px; width: auto; object-fit: contain;">
            </a>

            <nav class="gf-nav-section">
                <a href="/admin/dashboard.html" class="gf-nav-link">
                    <i class="bi bi-grid-fill"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/vehicles.html" class="gf-nav-link">
                    <i class="bi bi-truck"></i>
                    <span>Fleet</span>
                </a>
                <a href="/admin/customers.html" class="gf-nav-link active">
                    <i class="bi bi-people"></i>
                    <span>Customers</span>
                </a>
                <a href="/admin/appointments.html" class="gf-nav-link">
                    <i class="bi bi-tools"></i>
                    <span>Requests</span>
                </a>
                <a href="/admin/services.html" class="gf-nav-link">
                    <i class="bi bi-journal-code"></i>
                    <span>Playbooks</span>
                </a>
                <a href="/admin/billing.html" class="gf-nav-link">
                    <i class="bi bi-graph-up-arrow"></i>
                    <span>Analytics</span>
                </a>
                <a href="/admin/parts.html" class="gf-nav-link">
                    <i class="bi bi-boxes"></i>
                    <span>Parts</span>
                </a>
            </nav>

            <div class="gf-sidebar-user">
                <img src="/images/albert_avatar.jpg" alt="User Avatar" class="gf-user-avatar">
                <div class="gf-user-info">
                    <span class="gf-user-name">Albert Flores</span>
                    <span class="gf-user-email">flores@autofleet.app</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="gf-main-content">
            <!-- Header -->
            <header class="gf-top-header">
                <div class="gf-page-title-group">
                    <i class="bi bi-people gf-page-icon"></i>
                    <h1 class="gf-page-title">Customer Accounts Directory</h1>
                </div>

                <div class="gf-header-actions">
                    <div class="gf-search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Search customer by name, email, or phone...">
                    </div>
                    <button class="btn-gf-primary-pill" onclick="loadCustomers()">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </header>

            <div id="alertContainer"></div>

            <div class="gf-incidents-card">
                <div class="table-responsive">
                    <table class="table table-gf-dark">
                        <thead>
                            <tr>
                                <th>Customer ID</th>
                                <th>Full Name</th>
                                <th>Email Address</th>
                                <th>Phone Number</th>
                                <th>Vehicles Registered</th>
                                <th>Registration Date</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customersTableBody">
                            <tr><td colspan="7" class="text-center text-muted">Loading customer directory...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        if (typeof requireAuth === 'function') {
            try { requireAuth('ADMIN'); } catch(e) {}
        }

        async function loadCustomers() {
            const search = document.getElementById('searchInput').value;
            const res = await apiFetch(`/admin/customers?search=${encodeURIComponent(search)}`);
            const tbody = document.getElementById('customersTableBody');

            if (res && res.success && res.customers.length > 0) {
                tbody.innerHTML = res.customers.map(c => `
                    <tr>
                        <td class="fw-bold font-monospace text-info">#CUST-${c.id}</td>
                        <td class="fw-semibold text-white">${c.name}</td>
                        <td class="text-secondary">${c.email}</td>
                        <td class="text-secondary">${c.phone}</td>
                        <td><span class="status-pill low">${c.vehicle_count} Vehicles</span></td>
                        <td class="text-muted">${c.created_at ? c.created_at.split('T')[0] : 'N/A'}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteCustomer(${c.id}, '${c.name}')">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = `
                    <tr>
                        <td class="fw-bold font-monospace text-info">#CUST-101</td>
                        <td class="fw-semibold text-white">Albert Flores</td>
                        <td class="text-secondary">flores@autofleet.app</td>
                        <td class="text-secondary">+1 555-0192</td>
                        <td><span class="status-pill low">2 Vehicles</span></td>
                        <td class="text-muted">2026-09-01</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="alert('Demo customer profile protected.')">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td class="fw-bold font-monospace text-info">#CUST-102</td>
                        <td class="fw-semibold text-white">Eleanor Pena</td>
                        <td class="text-secondary">eleanor@logistics.com</td>
                        <td class="text-secondary">+1 555-0482</td>
                        <td><span class="status-pill low">1 Vehicle</span></td>
                        <td class="text-muted">2026-09-02</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="alert('Demo customer profile protected.')">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
            }
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') loadCustomers();
        });

        loadCustomers();
    </script>
</body>
</html>
