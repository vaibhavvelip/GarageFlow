<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle — GarageFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-garageflow">
        <div class="container-fluid">
            <a class="navbar-brand-logo" href="/admin/dashboard.html">
                <img src="/images/logo.png" alt="GarageFlow Logo" style="height: 52px; max-height: 60px; width: auto; object-fit: contain;">
            </a>
            <div id="navUserContainer" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="gf-card">
                    <div class="gf-card-header">
                        <h4 class="gf-card-title"><i class="bi bi-car-front-fill me-2 text-primary"></i> Register New Vehicle</h4>
                        <a href="/customer/vehicles.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to Fleet</a>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="addVehicleForm">
                        <div class="mb-3">
                            <label for="registrationNumber" class="form-label fw-semibold">Registration Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control text-uppercase" id="registrationNumber" required placeholder="e.g. MH-12-AB-1234">
                            <div class="form-text">Unique vehicle license plate registration number.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="brand" class="form-label fw-semibold">Vehicle Brand / Make <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="brand" required placeholder="e.g. Honda, BMW, Toyota">
                            </div>
                            <div class="col-md-6">
                                <label for="model" class="form-label fw-semibold">Model <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="model" required placeholder="e.g. Civic, 330i, Fortuner">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="year" class="form-label fw-semibold">Manufacturing Year <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="year" required min="1900" max="2026" value="2022">
                            </div>
                            <div class="col-md-4">
                                <label for="fuelType" class="form-label fw-semibold">Fuel Type <span class="text-danger">*</span></label>
                                <select class="form-select" id="fuelType" required>
                                    <option value="Petrol" selected>Petrol</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="Electric">Electric</option>
                                    <option value="Hybrid">Hybrid</option>
                                    <option value="CNG">CNG</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="vehicleType" class="form-label fw-semibold">Vehicle Category <span class="text-danger">*</span></label>
                                <select class="form-select" id="vehicleType" required>
                                    <option value="Car" selected>Car</option>
                                    <option value="SUV">SUV</option>
                                    <option value="Bike">Bike</option>
                                    <option value="Scooter">Scooter</option>
                                    <option value="Van">Van</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="mileage" class="form-label fw-semibold">Current Odometer Mileage (km)</label>
                            <input type="number" class="form-control" id="mileage" min="0" value="15000">
                        </div>

                        <div class="d-flex gap-2">
                            <a href="/customer/vehicles.html" class="btn btn-outline-secondary w-50">Cancel</a>
                            <button type="submit" class="btn btn-gf-primary w-50">
                                <i class="bi bi-check-circle me-1"></i> Register Vehicle
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        requireAuth('CUSTOMER');

        document.getElementById('addVehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const registration_number = document.getElementById('registrationNumber').value.trim();
            const brand = document.getElementById('brand').value.trim();
            const model = document.getElementById('model').value.trim();
            const year = parseInt(document.getElementById('year').value);
            const fuel_type = document.getElementById('fuelType').value;
            const vehicle_type = document.getElementById('vehicleType').value;
            const mileage = parseInt(document.getElementById('mileage').value) || 0;

            const res = await apiFetch('/vehicles', {
                method: 'POST',
                body: JSON.stringify({ registration_number, brand, model, year, fuel_type, vehicle_type, mileage })
            });

            if (res.success) {
                showAlert('Vehicle added successfully! Redirecting to fleet list...', 'success');
                setTimeout(() => {
                    window.location.href = '/customer/vehicles.html';
                }, 800);
            } else {
                showAlert(res.message || 'Failed to add vehicle.');
            }
        });
    </script>
</body>
</html>
