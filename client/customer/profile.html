<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile — GarageFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-garageflow">
        <div class="container-fluid">
            <a class="navbar-brand-logo" href="/admin/dashboard.html">
                <img src="/images/logo.png" alt="GarageFlow Logo" style="height: 52px; max-height: 60px; width: auto; object-fit: contain;">
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link nav-link-gf" href="/customer/dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-gf" href="/customer/vehicles.html">My Vehicles</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-gf" href="/customer/appointments.html">Appointments</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-gf" href="/customer/service-history.html">Service History</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-gf" href="/customer/bills.html">Bills & Invoices</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-gf active" href="/customer/profile.html">Profile</a></li>
                </ul>
                <div id="navUserContainer" class="d-flex align-items-center"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="gf-card">
                    <div class="gf-card-header">
                        <h4 class="gf-card-title"><i class="bi bi-person-gear me-2 text-primary"></i> Customer Account Settings</h4>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address (Read-only)</label>
                            <input type="email" class="form-control" id="profileEmail" readonly disabled>
                        </div>

                        <div class="mb-3">
                            <label for="profileName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="profileName" required>
                        </div>

                        <div class="mb-3">
                            <label for="profilePhone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="profilePhone" required>
                        </div>

                        <hr class="my-4">

                        <h6 class="fw-bold mb-3"><i class="bi bi-key me-1"></i> Change Password (Optional)</h6>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">New Password</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="Leave blank to keep current password">
                        </div>

                        <button type="submit" class="btn btn-gf-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-save me-1"></i> Save Profile Changes
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        requireAuth('CUSTOMER');

        async function loadProfile() {
            const res = await apiFetch('/auth/profile');
            if (res.success) {
                const u = res.user;
                document.getElementById('profileEmail').value = u.email;
                document.getElementById('profileName').value = u.name;
                document.getElementById('profilePhone').value = u.phone;
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('profileName').value.trim();
            const phone = document.getElementById('profilePhone').value.trim();
            const password = document.getElementById('newPassword').value;

            const res = await apiFetch('/auth/profile', {
                method: 'PUT',
                body: JSON.stringify({ name, phone, password: password || undefined })
            });

            if (res.success) {
                // Update local storage user name
                const u = getCurrentUser();
                if (u) {
                    u.name = name;
                    u.phone = phone;
                    localStorage.setItem('garageflow_user', JSON.stringify(u));
                    initAuthUI();
                }
                showAlert('Profile updated successfully!', 'success');
                document.getElementById('newPassword').value = '';
            } else {
                showAlert(res.message || 'Failed to update profile.');
            }
        });

        loadProfile();
    </script>
</body>
</html>
