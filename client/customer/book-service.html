<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service — GarageFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/logo.png">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-garageflow">
        <div class="container-fluid">
            <a class="navbar-brand-logo" href="/admin/dashboard.html">
                <img src="/images/logo.png" alt="GarageFlow Logo" style="height: 52px; max-height: 60px; width: auto; object-fit: contain;">
            </a>
            <div id="navUserContainer" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="gf-card">
                    <div class="gf-card-header">
                        <h4 class="gf-card-title"><i class="bi bi-calendar-plus-fill me-2 text-primary"></i> Book Service Appointment</h4>
                        <a href="/customer/appointments.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> My Appointments</a>
                    </div>

                    <div id="alertContainer"></div>

                    <form id="bookServiceForm">
                        <div class="mb-3">
                            <label for="vehicleSelect" class="form-label fw-semibold">Select Vehicle <span class="text-danger">*</span></label>
                            <select class="form-select" id="vehicleSelect" required>
                                <option value="" disabled selected>Loading your registered vehicles...</option>
                            </select>
                            <div class="form-text">Don't see your vehicle? <a href="/customer/add-vehicle.html" class="text-decoration-none">Add a new vehicle here</a>.</div>
                        </div>

                        <div class="mb-3">
                            <label for="serviceType" class="form-label fw-semibold">Service Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="serviceType" required>
                                <option value="General Service">General Service & Inspection</option>
                                <option value="Oil Change">Oil Change & Filter Replacement</option>
                                <option value="Brake Service">Brake Service & Pad Swap</option>
                                <option value="Battery Service">Battery Service & Electrical Diagnostics</option>
                                <option value="AC Service">Air Conditioning Servicing</option>
                                <option value="Tyre Service">Tyre Rotation, Alignment & Balancing</option>
                                <option value="Engine Repair">Engine Repair & Tuning</option>
                                <option value="Electrical Repair">Electrical Repair & Wiring</option>
                                <option value="Other">Other Custom Work</option>
                            </select>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="appointmentDate" class="form-label fw-semibold">Preferred Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="appointmentDate" required>
                            </div>
                            <div class="col-md-6">
                                <label for="appointmentTime" class="form-label fw-semibold">Preferred Time Slot <span class="text-danger">*</span></label>
                                <select class="form-select" id="appointmentTime" required>
                                    <option value="09:00 AM">09:00 AM - 10:30 AM</option>
                                    <option value="11:00 AM">11:00 AM - 12:30 PM</option>
                                    <option value="02:00 PM">02:00 PM - 03:30 PM</option>
                                    <option value="04:00 PM">04:00 PM - 05:30 PM</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="mileage" class="form-label fw-semibold">Current Mileage (km)</label>
                            <input type="number" class="form-control" id="mileage" placeholder="e.g. 24500">
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Problem Description / Custom Requests</label>
                            <textarea class="form-control" id="description" rows="3" placeholder="Describe symptoms, noise, warning lights, or specific instructions for our workshop technicians..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-gf-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-calendar-check me-2"></i> Confirm Booking Request
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        requireAuth('CUSTOMER');

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('appointmentDate').min = today;
        document.getElementById('appointmentDate').value = today;

        let vehiclesMap = {};

        async function loadUserVehicles() {
            const res = await apiFetch('/vehicles');
            const select = document.getElementById('vehicleSelect');

            if (res.success && res.vehicles.length > 0) {
                select.innerHTML = res.vehicles.map(v => {
                    vehiclesMap[v.id] = v;
                    return `<option value="${v.id}">${v.brand} ${v.model} (${v.registration_number})</option>`;
                }).join('');

                // Auto populate mileage
                const first = res.vehicles[0];
                document.getElementById('mileage').value = first.mileage || '';
            } else {
                select.innerHTML = `<option value="" disabled selected>No vehicles registered. Please add a vehicle first!</option>`;
            }
        }

        document.getElementById('vehicleSelect').addEventListener('change', (e) => {
            const vId = e.target.value;
            if (vehiclesMap[vId]) {
                document.getElementById('mileage').value = vehiclesMap[vId].mileage || '';
            }
        });

        document.getElementById('bookServiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const vehicle_id = document.getElementById('vehicleSelect').value;
            const service_type = document.getElementById('serviceType').value;
            const appointment_date = document.getElementById('appointmentDate').value;
            const appointment_time = document.getElementById('appointmentTime').value;
            const mileage = document.getElementById('mileage').value;
            const description = document.getElementById('description').value;

            if (!vehicle_id) {
                showAlert('Please select a valid vehicle.');
                return;
            }

            const res = await apiFetch('/appointments', {
                method: 'POST',
                body: JSON.stringify({ vehicle_id, service_type, appointment_date, appointment_time, mileage, description })
            });

            if (res.success) {
                showAlert('Service appointment requested successfully! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/customer/appointments.html';
                }, 800);
            } else {
                showAlert(res.message || 'Failed to book appointment.');
            }
        });

        loadUserVehicles();
    </script>
</body>
</html>
